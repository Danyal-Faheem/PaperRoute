<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PaperRoute — evidence-verified literature triage for graduate researchers.">
    <title>{% block title %}PaperRoute{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='paperroute.css') if url_for is defined else '/static/paperroute.css' }}">
    {% block head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="PaperRoute home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>paper<span class="brand-accent">route</span></span>
        </a>
        <nav class="top-nav" aria-label="Primary navigation">
          <a href="/">New triage</a>
          <a href="{{ benchmark_url|default('/benchmark') }}">Evaluation</a>
        </nav>
      </div>
    </header>
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <span class="footer-brand">paper<span class="brand-accent">route</span></span>
        <span>Evidence first · built for focused reading</span>
      </div>
    </footer>
    <script src="{{ url_for('static', path='htmx-lite.js') if url_for is defined else '/static/htmx-lite.js' }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
